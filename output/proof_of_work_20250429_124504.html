ar-old Dogpatch studio. Run by husband-wife duo Mimi Moncier and Alan Lewis, the spot’s emphasis is on small class sizes—often 10 students or less—and individualized attention. But though the spot’s 60- or 90-minute classes are intimate, the light-flooded space is luxuriously spacious, decked with globe lanterns, fresh flowers, and colorful drapes. The crowd is arty and creative; Lewis is a working architect and Moncier is an exhibiting artist. Giggling Lotus teachers adapt vinyasa and hatha flow styles, but slower-paced yin classes—as well as pre- and postnatal variations—are also available. Drop-in for a weekly meditation class for just $5.\n\n[Read more](/san-francisco/things-to-do/giggling-lotus)\n\n[### 2. Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\n\n* Things to do\n* Mission\n* price 1 of 4\n\n[![Yoga to the People](https://media.timeout.com/images/103748187/750/422/image.jpg \"Yoga to the People\")\n\n![Yoga to the People](https://media.timeout.com/images/103748187/750/562/image.jpg \"Yoga to the People\")\n\nPhotograph: Courtesy Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\n\nYoga to the People is a bi-coastal institution, with studios in Manhattan, Brooklyn, Berkeley, and San Francisco. It’s easy to miss from the street level—hit the buzzer to be let up or just look for spandex-clad yogis on their way out the door. But the 5th-floor understated entrance belies the stunning space, fronted by a wall of windows overlooking the city. Wood beams overhead and scattered plants lend a warm, welcoming feel. (The studio is also kept quite warm—literally—thought it’s not hot yoga.) The studio’s motto, “no ego, no script, no pedestals,” is aptly reflected in its by-donation model. The body-positive vinyasa classes are vigorous, but unintimidating, focusing on the interplay between movement and breath. Need a distraction from a shaky pose? Teachers often play modern tracks, from reggae to indie rock to electronica.\n\n[Read more](/san-francisco/things-to-do/yoga-to-the-people)\n\nAdvertising\n\n[### 3. Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\n\n* Things to do\n* SoMa\n* price 3 of 4\n\n[![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/422/image.jpg \"Ritual Hot Yoga\")\n\n![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/562/image.jpg \"Ritual Hot Yoga\")\n\nPhotograph: Courtesy Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\n\nWith its charcoal-gray walls, complimentary towels and water, and moody lighting, this candlelit hot yoga studio feels unusually decadent. But the steep prices—$30 for a walk-in class—are the effect of a comparably novel business model. Rather than being paid as independent contractors, yoga teachers here are full-time, salaried employees with health benefits, vacation time, and sick days. The upgrade is apparent in the quality of the instruction—every class is staffed by two teachers, one for demonstrating, and one who cycles through the room to give one-on-one support and feedback. The fast-paced flow is synced to energizing soundtracks chosen by each teacher. In one class, you may hear ‘90s hits; in another, pulse-pumping remixes.\n\n[Read more](/san-francisco/things-to-do/ritual-hot-yoga)\n\n[### 4. Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\n\n* Things to do\n* Mission Dolores\n* price 2 of 4\n\n[![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/422/image.jpg \"Laughing Lotus Yoga Center\")\n\n![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/562/image.jpg \"Laughing Lotus Yoga Center\")\n\nPhotograph: Courtesy Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\n\nThis welcoming Mission yoga studio is refreshingly diverse—it’s not all spindly yogis in sports bras. You’ll know it by its distinctive melon-hued facade, painted with hearts and blooms. Owners Jasmine Tarkeshi and Dana Flynn opened this studio in 2007, retrofitting a former plumbing garage into a color-splashed haven for getting your flow on. You’ll find packed classes full of all different ages and abilities. Lotus Flow classes—the signature—move from breath-centered warm-ups to sun salutations, standing poses, inversions, arm balances, twists, and hip openers. For a faster-paced flow—more chaturangas, less chanting—book the Soul Sweat class, which incorporates cardio and core-building. Don’t miss Lotus Live classes, a party-like atmosphere in which local DJs or musicians provide a live soundtrack.\n\n[Read more](/san-francisco/things-to-do/laughing-lotus-yoga-center)\n\nAdvertising\n\n[### 5. Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\n\n* Things to do\n* Lower Haight\n* price 2 of 4\n\n[![Yoga Garden SF](https://media.timeout.com/images/103748215/750/422/image.jpg \"Yoga Garden SF\")\n\n![Yoga Garden SF](https://media.timeout.com/images/103748215/750/562/image.jpg \"Yoga Garden SF\")\n\nPhotograph: Courtesy Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\n\nHusband-wife yoga instructors Marisa Toriggino and David Nelson moved their Castro yoga studio to this location in 2004. It’s easy to see why: Set in a turn-of-the-century Victorian in the heart of NoPA, the three light-filled, wood-accented studios are one-of-a-kind. In addition to classic vinyasa, yin flow, restorative, and hatha classes, Yoga Garden offers novel classes to avoid a yoga rut, like boxing yoga, aromatherapy flow, and garden barre. (The candlelight flow on Friday evenings is particularly popular.) The changing rooms here are also equipped with showers, a welcome perk.\n\n[Read more](/san-francisco/things-to-do/yoga-garden-sf)\n\n[### 6. Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\n\n* Things to do\n* Cow Hollow\n* price 3 of 4\n\n[![Yoga Flow SF](https://media.timeout.com/images/103748217/750/422/image.jpg \"Yoga Flow SF\")\n\n![Yoga Flow SF](https://media.timeout.com/images/103748217/750/562/image.jpg \"Yoga Flow SF\")\n\nPhotograph: Courtesy Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\n\nIf the Marina is known as the land of Lululemon, this sunny, family-run studio is its church. The pristine, two-room space on the second floor of the Clock Tower building is swathed in floor-to-ceiling glass. The 60-, 75-, and 90-minute vinyasa flow classes are challenging and fast-paced, designed to make you sweat. Around 20 teachers work out of the Union Street studio; another 20 oversee classes at Yoga Flow’s second location in Ingleside Terrace. (Book a class with Union Street favorite Tom Lee—and arrive early to snag a spot.)\n\n[Read more](/san-francisco/things-to-do/yoga-flow-sf)\n\nAdvertising\n\n[### 7. Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\n\n* Things to do\n* Mission\n* price 3 of 4\n\n[![Yoga Mayu](https://media.timeout.com/images/103748219/750/422/image.jpg \"Yoga Mayu\")\n\n![Yoga Mayu](https://media.timeout.com/images/103748219/750/562/image.jpg \"Yoga Mayu\")\n\nPhotograph: Courtesy Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\n\nFounder Gizella Donald has been practicing yoga in San Francisco since the ‘90s, and the community feel is apparent, from the friendly staff to the post-class mingling around the tea station. She founded this studio in 2008 (and since added a second location in Noe Valley), offering heat-building vinyasa classes tailored to build endurance, flexibility, and strength. Advanced classes work on arm balances and inversions, while yin and mellow flow classes foster concentration and balance. Several of the instructors are former dancers, which means there’s a gentle emphasis placed on proper form and an innate sense of varying capabilities.\n\n[Read more](/san-francisco/things-to-do/yoga-mayu)\n\nBeen there, done that? Think again, my friend.\n\nSign up to our newsletter to enjoy Time Out without spending a thing (as well as options when you're feeling flush) se) and [Privacy Policy](https://www.timeout.com/privacy-notice) and consent to receive emails from Time Out about news, events, offers and partner promotions.\\n\\n🙌  \\nAwesome, you're subscribed!\\n\\nThanks for subscribing! Look out for your first newsletter in your inbox soon!\\n\\nS.F.’s top yoga studios\\n-----------------------\\n\\n[### 1. Giggling Lotus](/san-francisco/things-to-do/giggling-lotus)\\n\\n* Things to do\\n* Dogpatch\\n* price 2 of 4\\n\\n[![Giggling Lotus](https://media.timeout.com/images/103748186/750/422/image.jpg \\\"Giggling Lotus\\\")\\n\\n![Giggling Lotus](https://media.timeout.com/images/103748186/750/562/image.jpg \\\"Giggling Lotus\\\")\\n\\nPhotograph: Courtesy Giggling Lotus](/san-francisco/things-to-do/giggling-lotus)\\n\\nWalk-ins are welcome at this five-year-old Dogpatch studio. Run by husband-wife duo Mimi Moncier and Alan Lewis, the spot’s emphasis is on small class sizes—often 10 students or less—and individualized attention. But though the spot’s 60- or 90-minute classes are intimate, the light-flooded space is luxuriously spacious, decked with globe lanterns, fresh flowers, and colorful drapes. The crowd is arty and creative; Lewis is a working architect and Moncier is an exhibiting artist. Giggling Lotus teachers adapt vinyasa and hatha flow styles, but slower-paced yin classes—as well as pre- and postnatal variations—are also available. Drop-in for a weekly meditation class for just $5.\\n\\n[Read more](/san-francisco/things-to-do/giggling-lotus)\\n\\n[### 2. Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\\n\\n* Things to do\\n* Mission\\n* price 1 of 4\\n\\n[![Yoga to the People](https://media.timeout.com/images/103748187/750/422/image.jpg \\\"Yoga to the People\\\")\\n\\n![Yoga to the People](https://media.timeout.com/images/103748187/750/562/image.jpg \\\"Yoga to the People\\\")\\n\\nPhotograph: Courtesy Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\\n\\nYoga to the People is a bi-coastal institution, with studios in Manhattan, Brooklyn, Berkeley, and San Francisco. It’s easy to miss from the street level—hit the buzzer to be let up or just look for spandex-clad yogis on their way out the door. But the 5th-floor understated entrance belies the stunning space, fronted by a wall of windows overlooking the city. Wood beams overhead and scattered plants lend a warm, welcoming feel. (The studio is also kept quite warm—literally—thought it’s not hot yoga.) The studio’s motto, “no ego, no script, no pedestals,” is aptly reflected in its by-donation model. The body-positive vinyasa classes are vigorous, but unintimidating, focusing on the interplay between movement and breath. Need a distraction from a shaky pose? Teachers often play modern tracks, from reggae to indie rock to electronica.\\n\\n[Read more](/san-francisco/things-to-do/yoga-to-the-people)\\n\\nAdvertising\\n\\n[### 3. Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\\n\\n* Things to do\\n* SoMa\\n* price 3 of 4\\n\\n[![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/422/image.jpg \\\"Ritual Hot Yoga\\\")\\n\\n![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/562/image.jpg \\\"Ritual Hot Yoga\\\")\\n\\nPhotograph: Courtesy Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\\n\\nWith its charcoal-gray walls, complimentary towels and water, and moody lighting, this candlelit hot yoga studio feels unusually decadent. But the steep prices—$30 for a walk-in class—are the effect of a comparably novel business model. Rather than being paid as independent contractors, yoga teachers here are full-time, salaried employees with health benefits, vacation time, and sick days. The upgrade is apparent in the quality of the instruction—every class is staffed by two teachers, one for demonstrating, and one who cycles through the room to give one-on-one support and feedback. The fast-paced flow is synced to energizing soundtracks chosen by each teacher. In one class, you may hear ‘90s hits; in another, pulse-pumping remixes.\\n\\n[Read more](/san-francisco/things-to-do/ritual-hot-yoga)\\n\\n[### 4. Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\\n\\n* Things to do\\n* Mission Dolores\\n* price 2 of 4\\n\\n[![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/422/image.jpg \\\"Laughing Lotus Yoga Center\\\")\\n\\n![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/562/image.jpg \\\"Laughing Lotus Yoga Center\\\")\\n\\nPhotograph: Courtesy Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\\n\\nThis welcoming Mission yoga studio is refreshingly diverse—it’s not all spindly yogis in sports bras. You’ll know it by its distinctive melon-hued facade, painted with hearts and blooms. Owners Jasmine Tarkeshi and Dana Flynn opened this studio in 2007, retrofitting a former plumbing garage into a color-splashed haven for getting your flow on. You’ll find packed classes full of all different ages and abilities. Lotus Flow classes—the signature—move from breath-centered warm-ups to sun salutations, standing poses, inversions, arm balances, twists, and hip openers. For a faster-paced flow—more chaturangas, less chanting—book the Soul Sweat class, which incorporates cardio and core-building. Don’t miss Lotus Live classes, a party-like atmosphere in which local DJs or musicians provide a live soundtrack.\\n\\n[Read more](/san-francisco/things-to-do/laughing-lotus-yoga-center)\\n\\nAdvertising\\n\\n[### 5. Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\\n\\n* Things to do\\n* Lower Haight\\n* price 2 of 4\\n\\n[![Yoga Garden SF](https://media.timeout.com/images/103748215/750/422/image.jpg \\\"Yoga Garden SF\\\")\\n\\n![Yoga Garden SF](https://media.timeout.com/images/103748215/750/562/image.jpg \\\"Yoga Garden SF\\\")\\n\\nPhotograph: Courtesy Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\\n\\nHusband-wife yoga instructors Marisa Toriggino and David Nelson moved their Castro yoga studio to this location in 2004. It’s easy to see why: Set in a turn-of-the-century Victorian in the heart of NoPA, the three light-filled, wood-accented studios are one-of-a-kind. In addition to classic vinyasa, yin flow, restorative, and hatha classes, Yoga Garden offers novel classes to avoid a yoga rut, like boxing yoga, aromatherapy flow, and garden barre. (The candlelight flow on Friday evenings is particularly popular.) The changing rooms here are also equipped with showers, a welcome perk.\\n\\n[Read more](/san-francisco/things-to-do/yoga-garden-sf)\\n\\n[### 6. Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\\n\\n* Things to do\\n* Cow Hollow\\n* price 3 of 4\\n\\n[![Yoga Flow SF](https://media.timeout.com/images/103748217/750/422/image.jpg \\\"Yoga Flow SF\\\")\\n\\n![Yoga Flow SF](https://media.timeout.com/images/103748217/750/562/image.jpg \\\"Yoga Flow SF\\\")\\n\\nPhotograph: Courtesy Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\\n\\nIf the Marina is known as the land of Lululemon, this sunny, family-run studio is its church. The pristine, two-room space on the second floor of the Clock Tower building is swathed in floor-to-ceiling glass. The 60-, 75-, and 90-minute vinyasa flow classes are challenging and fast-paced, designed to make you sweat. Around 20 teachers work out of the Union Street studio; another 20 oversee classes at Yoga Flow’s second location in Ingleside Terrace. (Book a class with Union Street favorite Tom Lee—and arrive early to snag a spot.)\\n\\n[Read more](/san-francisco/things-to-do/yoga-flow-sf)\\n\\nAdvertising\\n\\n[### 7. Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\\n\\n* Things to do\\n* Mission\\n* price 3 of 4\\n\\n[![Yoga Mayu](https://media.timeout.com/images/103748219/750/422/image.jpg \\\"Yoga Mayu\\\")\\n\\n![Yoga Mayu](https://media.timeout.com/images/103748219/750/562/image.jpg \\\"Yoga Mayu\\\")\\n\\nPhotograph: Courtesy Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\\n\\nFounder Gizella Donald has been practicing yoga in San Francisco since the ‘90s, and the community feel is apparent, from the friendly staff to the post-class mingling around the tea station. She founded this studio in 2008 (and since added a second location in Noe Valley), offering heat-building vinyasa classes tailored to build endurance, flexibility, and strength. Advanced classes work on arm balances and inversions, while yin and mellow flow classes foster concentration and balance. Several of the instructors are former dancers, which means there’s a gentle emphasis placed on proper form and an innate sense of varying capabilities.\\n\\n[Read more](/san-francisco/things-to-do/yoga-mayu)\\n\\nBeen there, done that? Think again, my friend.\\n\\nSign up to our newsletter to enjoy Time Out without spending a thing (as well as options when you're feeling flush).\\n\\nEnter email address![Loading animation](/static/images/loading_icon.gif)\\n\\nDéjà vu! We already have this email. Try another?\\n\\nBy entering your email address you agree to our [Terms of Use](https://www.timeout.com/usa/terms-of-use) and [Privacy Policy](https://www.timeout.com/privacy-notice) and consent to receive emails from Time Out about news, events, offers and partner promotions.\\n\\n🙌  \\nAwesome, you're subscribed!\\n\\nThanks for subscribing! Look out for your first newsletter in your inbox soon!\\n\\nBeen there, done that? Think again, my friend.\\n\\nSign up to our newsletter to enjoy Time Out without spending a thing (as well as options when you're feeling flush).\\n\\nEmail address![Loading animation](/static/images/loading_icon.gif)\\n\\nDéjà vu! We already have this email. Try another?\\n\\nBy entering your email address you agree to our [Terms of Use](https://www.timeout.com/usa/terms-of-use) and [Privacy Policy](https://www.timeout.com/privacy-notice) and consent to receive emails from Time Out pp://send?text=The%20best%20yoga%20studios%20in%20san%20Francisco%20https://www.timeout.com/san-francisco/things-to-do/the-best-yoga-studios-in-san-francisco)\n\nWritten by [Lauren Sheber](https://www.timeout.com/profile/lauren-sheber)\n\nTime Out San Francisco Contributer\n\nAdvertising\n\nIn a city where yoga studios are nearly as plentiful as fussy coffee shops, it can be difficult to decide where to get your ‘om’ on. Some want a pristine, white box for sweating away stress. Others seek community, core strength, and a nice deep stretch. And some just want to rock out to Beyonce while burning through sun salutations. Whatever your inner yogi desires, San Francisco has a studio—and an eager instructor—for you. Here’s where to find the best bikram, vinyasa, prenatal, and restorative classes in the city.\n\nBeen there, done that? Think again, my friend.\n\nSign up to our newsletter to enjoy Time Out without spending a thing (as well as options when you're feeling flush).\n\nEnter email address![Loading animation](/static/images/loading_icon.gif)\n\nDéjà vu! We already have this email. Try another?\n\nBy entering your email address you agree to our [Terms of Use](https://www.timeout.com/usa/terms-of-use) and [Privacy Policy](https://www.timeout.com/privacy-notice) and consent to receive emails from Time Out about news, events, offers and partner promotions.\n\n🙌  \nAwesome, you're subscribed!\n\nThanks for subscribing! Look out for your first newsletter in your inbox soon!\n\nS.F.’s top yoga studios\n-----------------------\n\n[### 1. Giggling Lotus](/san-francisco/things-to-do/giggling-lotus)\n\n* Things to do\n* Dogpatch\n* price 2 of 4\n\n[![Giggling Lotus](https://media.timeout.com/images/103748186/750/422/image.jpg \"Giggling Lotus\")\n\n![Giggling Lotus](https://media.timeout.com/images/103748186/750/562/image.jpg \"Giggling Lotus\")\n\nPhotograph: Courtesy Giggling Lotus](/san-francisco/things-to-do/giggling-lotus)\n\nWalk-ins are welcome at this five-year-old Dogpatch studio. Run by husband-wife duo Mimi Moncier and Alan Lewis, the spot’s emphasis is on small class sizes—often 10 students or less—and individualized attention. But though the spot’s 60- or 90-minute classes are intimate, the light-flooded space is luxuriously spacious, decked with globe lanterns, fresh flowers, and colorful drapes. The crowd is arty and creative; Lewis is a working architect and Moncier is an exhibiting artist. Giggling Lotus teachers adapt vinyasa and hatha flow styles, but slower-paced yin classes—as well as pre- and postnatal variations—are also available. Drop-in for a weekly meditation class for just $5.\n\n[Read more](/san-francisco/things-to-do/giggling-lotus)\n\n[### 2. Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\n\n* Things to do\n* Mission\n* price 1 of 4\n\n[![Yoga to the People](https://media.timeout.com/images/103748187/750/422/image.jpg \"Yoga to the People\")\n\n![Yoga to the People](https://media.timeout.com/images/103748187/750/562/image.jpg \"Yoga to the People\")\n\nPhotograph: Courtesy Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\n\nYoga to the People is a bi-coastal institution, with studios in Manhattan, Brooklyn, Berkeley, and San Francisco. It’s easy to miss from the street level—hit the buzzer to be let up or just look for spandex-clad yogis on their way out the door. But the 5th-floor understated entrance belies the stunning space, fronted by a wall of windows overlooking the city. Wood beams overhead and scattered plants lend a warm, welcoming feel. (The studio is also kept quite warm—literally—thought it’s not hot yoga.) The studio’s motto, “no ego, no script, no pedestals,” is aptly reflected in its by-donation model. The body-positive vinyasa classes are vigorous, but unintimidating, focusing on the interplay between movement and breath. Need a distraction from a shaky pose? Teachers often play modern tracks, from reggae to indie rock to electronica.\n\n[Read more](/san-francisco/things-to-do/yoga-to-the-people)\n\nAdvertising\n\n[### 3. Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\n\n* Things to do\n* SoMa\n* price 3 of 4\n\n[![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/422/image.jpg \"Ritual Hot Yoga\")\n\n![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/562/image.jpg \"Ritual Hot Yoga\")\n\nPhotograph: Courtesy Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\n\nWith its charcoal-gray walls, complimentary towels and water, and moody lighting, this candlelit hot yoga studio feels unusually decadent. But the steep prices—$30 for a walk-in class—are the effect of a comparably novel business model. Rather than being paid as independent contractors, yoga teachers here are full-time, salaried employees with health benefits, vacation time, and sick days. The upgrade is apparent in the quality of the instruction—every class is staffed by two teachers, one for demonstrating, and one who cycles through the room to give one-on-one support and feedback. The fast-paced flow is synced to energizing soundtracks chosen by each teacher. In one class, you may hear ‘90s hits; in another, pulse-pumping remixes.\n\n[Read more](/san-francisco/things-to-do/ritual-hot-yoga)\n\n[### 4. Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\n\n* Things to do\n* Mission Dolores\n* price 2 of 4\n\n[![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/422/image.jpg \"Laughing Lotus Yoga Center\")\n\n![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/562/image.jpg \"Laughing Lotus Yoga Center\")\n\nPhotograph: Courtesy Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\n\nThis welcoming Mission yoga studio is refreshingly diverse—it’s not all spindly yogis in sports bras. You’ll know it by its distinctive melon-hued facade, painted with hearts and blooms. Owners Jasmine Tarkeshi and Dana Flynn opened this studio in 2007, retrofitting a former plumbing garage into a color-splashed haven for getting your flow on. You’ll find packed classes full of all different ages and abilities. Lotus Flow classes—the signature—move from breath-centered warm-ups to sun salutations, standing poses, inversions, arm balances, twists, and hip openers. For a faster-paced flow—more chaturangas, less chanting—book the Soul Sweat class, which incorporates cardio and core-building. Don’t miss Lotus Live classes, a party-like atmosphere in which local DJs or musicians provide a live soundtrack.\n\n[Read more](/san-francisco/things-to-do/laughing-lotus-yoga-center)\n\nAdvertising\n\n[### 5. Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\n\n* Things to do\n* Lower Haight\n* price 2 of 4\n\n[![Yoga Garden SF](https://media.timeout.com/images/103748215/750/422/image.jpg \"Yoga Garden SF\")\n\n![Yoga Garden SF](https://media.timeout.com/images/103748215/750/562/image.jpg \"Yoga Garden SF\")\n\nPhotograph: Courtesy Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\n\nHusband-wife yoga instructors Marisa Toriggino and David Nelson moved their Castro yoga studio to this location in 2004. It’s easy to see why: Set in a turn-of-the-century Victorian in the heart of NoPA, the three light-filled, wood-accented studios are one-of-a-kind. In addition to classic vinyasa, yin flow, restorative, and hatha classes, Yoga Garden offers novel classes to avoid a yoga rut, like boxing yoga, aromatherapy flow, and garden barre. (The candlelight flow on Friday evenings is particularly popular.) The changing rooms here are also equipped with showers, a welcome perk.\n\n[Read more](/san-francisco/things-to-do/yoga-garden-sf)\n\n[### 6. Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\n\n* Things to do\n* Cow Hollow\n* price 3 of 4\n\n[![Yoga Flow SF](https://media.timeout.com/images/103748217/750/422/image.jpg \"Yoga Flow SF\")\n\n![Yoga Flow SF](https://media.timeout.com/images/103748217/750/562/image.jpg \"Yoga Flow SF\")\n\nPhotograph: Courtesy Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\n\nIf the Marina is known as the land of Lululemon, this sunny, family-run studio is its church. The pristine, two-room space on the second floor of the Clock Tower building is swathed in floor-to-ceiling glass. The 60-, 75-, and 90-minute vinyasa flow classes are challenging and fast-paced, designed to make you sweat. Around 20 teachers work out of the Union Street studio; another 20 oversee classes at Yoga Flow’s second location in Ingleside Terrace. (Book a class with Union Street favorite Tom Lee—and arrive early to snag a spot.)\n\n[Read more](/san-francisco/things-to-do/yoga-flow-sf)\n\nAdvertising\n\n[### 7. Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\n\n* Things to do\n* Mission\n* price 3 of 4\n\n[![Yoga Mayu](https://media.timeout.com/images/103748219/750/422/image.jpg \"Yoga Mayu\")\n\n![Yoga Mayu](https://media.timeout.com/images/103748219/750/562/image.jpg \"Yoga Mayu\")\n\nPhotograph: Courtesy Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\n\nFounder Gizella Donald has been practicing yoga in San Francisco since the ‘90s, and the community feel is apparent, from the friendly staff to the post-class mingling around the tea station. She founded this studio in 2008 (and since added a second location in Noe Valley), offering heat-building vinyasa classes tailored to build endurance, flexibility, and strength. Advanced classes work on arm balances and inversions, while yin and mellow flow classes foster concentration and balance. Several of the instructors are former dancers, which means there’s a gentle emphasis placed on proper form and an innate sense of varying capabilities.\n\n[Read more](/san-francisco/things-to-do/yoga-mayu)\n\nBeen there, done that? Think again, my friend.\n\nSign up to our newsletter to enjoy Time Out without spending a thing (as well as options when you're feeling flush).\n\nEn timeout.com/images/103748186/750/422/image.jpg \\\"Giggling Lotus\\\")\\n\\n![Giggling Lotus](https://media.timeout.com/images/103748186/750/562/image.jpg \\\"Giggling Lotus\\\")\\n\\nPhotograph: Courtesy Giggling Lotus](/san-francisco/things-to-do/giggling-lotus)\\n\\nWalk-ins are welcome at this five-year-old Dogpatch studio. Run by husband-wife duo Mimi Moncier and Alan Lewis, the spot’s emphasis is on small class sizes—often 10 students or less—and individualized attention. But though the spot’s 60- or 90-minute classes are intimate, the light-flooded space is luxuriously spacious, decked with globe lanterns, fresh flowers, and colorful drapes. The crowd is arty and creative; Lewis is a working architect and Moncier is an exhibiting artist. Giggling Lotus teachers adapt vinyasa and hatha flow styles, but slower-paced yin classes—as well as pre- and postnatal variations—are also available. Drop-in for a weekly meditation class for just $5.\\n\\n[Read more](/san-francisco/things-to-do/giggling-lotus)\\n\\n[### 2. Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\\n\\n* Things to do\\n* Mission\\n* price 1 of 4\\n\\n[![Yoga to the People](https://media.timeout.com/images/103748187/750/422/image.jpg \\\"Yoga to the People\\\")\\n\\n![Yoga to the People](https://media.timeout.com/images/103748187/750/562/image.jpg \\\"Yoga to the People\\\")\\n\\nPhotograph: Courtesy Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\\n\\nYoga to the People is a bi-coastal institution, with studios in Manhattan, Brooklyn, Berkeley, and San Francisco. It’s easy to miss from the street level—hit the buzzer to be let up or just look for spandex-clad yogis on their way out the door. But the 5th-floor understated entrance belies the stunning space, fronted by a wall of windows overlooking the city. Wood beams overhead and scattered plants lend a warm, welcoming feel. (The studio is also kept quite warm—literally—thought it’s not hot yoga.) The studio’s motto, “no ego, no script, no pedestals,” is aptly reflected in its by-donation model. The body-positive vinyasa classes are vigorous, but unintimidating, focusing on the interplay between movement and breath. Need a distraction from a shaky pose? Teachers often play modern tracks, from reggae to indie rock to electronica.\\n\\n[Read more](/san-francisco/things-to-do/yoga-to-the-people)\\n\\nAdvertising\\n\\n[### 3. Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\\n\\n* Things to do\\n* SoMa\\n* price 3 of 4\\n\\n[![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/422/image.jpg \\\"Ritual Hot Yoga\\\")\\n\\n![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/562/image.jpg \\\"Ritual Hot Yoga\\\")\\n\\nPhotograph: Courtesy Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\\n\\nWith its charcoal-gray walls, complimentary towels and water, and moody lighting, this candlelit hot yoga studio feels unusually decadent. But the steep prices—$30 for a walk-in class—are the effect of a comparably novel business model. Rather than being paid as independent contractors, yoga teachers here are full-time, salaried employees with health benefits, vacation time, and sick days. The upgrade is apparent in the quality of the instruction—every class is staffed by two teachers, one for demonstrating, and one who cycles through the room to give one-on-one support and feedback. The fast-paced flow is synced to energizing soundtracks chosen by each teacher. In one class, you may hear ‘90s hits; in another, pulse-pumping remixes.\\n\\n[Read more](/san-francisco/things-to-do/ritual-hot-yoga)\\n\\n[### 4. Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\\n\\n* Things to do\\n* Mission Dolores\\n* price 2 of 4\\n\\n[![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/422/image.jpg \\\"Laughing Lotus Yoga Center\\\")\\n\\n![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/562/image.jpg \\\"Laughing Lotus Yoga Center\\\")\\n\\nPhotograph: Courtesy Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\\n\\nThis welcoming Mission yoga studio is refreshingly diverse—it’s not all spindly yogis in sports bras. You’ll know it by its distinctive melon-hued facade, painted with hearts and blooms. Owners Jasmine Tarkeshi and Dana Flynn opened this studio in 2007, retrofitting a former plumbing garage into a color-splashed haven for getting your flow on. You’ll find packed classes full of all different ages and abilities. Lotus Flow classes—the signature—move from breath-centered warm-ups to sun salutations, standing poses, inversions, arm balances, twists, and hip openers. For a faster-paced flow—more chaturangas, less chanting—book the Soul Sweat class, which incorporates cardio and core-building. Don’t miss Lotus Live classes, a party-like atmosphere in which local DJs or musicians provide a live soundtrack.\\n\\n[Read more](/san-francisco/things-to-do/laughing-lotus-yoga-center)\\n\\nAdvertising\\n\\n[### 5. Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\\n\\n* Things to do\\n* Lower Haight\\n* price 2 of 4\\n\\n[![Yoga Garden SF](https://media.timeout.com/images/103748215/750/422/image.jpg \\\"Yoga Garden SF\\\")\\n\\n![Yoga Garden SF](https://media.timeout.com/images/103748215/750/562/image.jpg \\\"Yoga Garden SF\\\")\\n\\nPhotograph: Courtesy Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\\n\\nHusband-wife yoga instructors Marisa Toriggino and David Nelson moved their Castro yoga studio to this location in 2004. It’s easy to see why: Set in a turn-of-the-century Victorian in the heart of NoPA, the three light-filled, wood-accented studios are one-of-a-kind. In addition to classic vinyasa, yin flow, restorative, and hatha classes, Yoga Garden offers novel classes to avoid a yoga rut, like boxing yoga, aromatherapy flow, and garden barre. (The candlelight flow on Friday evenings is particularly popular.) The changing rooms here are also equipped with showers, a welcome perk.\\n\\n[Read more](/san-francisco/things-to-do/yoga-garden-sf)\\n\\n[### 6. Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\\n\\n* Things to do\\n* Cow Hollow\\n* price 3 of 4\\n\\n[![Yoga Flow SF](https://media.timeout.com/images/103748217/750/422/image.jpg \\\"Yoga Flow SF\\\")\\n\\n![Yoga Flow SF](https://media.timeout.com/images/103748217/750/562/image.jpg \\\"Yoga Flow SF\\\")\\n\\nPhotograph: Courtesy Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\\n\\nIf the Marina is known as the land of Lululemon, this sunny, family-run studio is its church. The pristine, two-room space on the second floor of the Clock Tower building is swathed in floor-to-ceiling glass. The 60-, 75-, and 90-minute vinyasa flow classes are challenging and fast-paced, designed to make you sweat. Around 20 teachers work out of the Union Street studio; another 20 oversee classes at Yoga Flow’s second location in Ingleside Terrace. (Book a class with Union Street favorite Tom Lee—and arrive early to snag a spot.)\\n\\n[Read more](/san-francisco/things-to-do/yoga-flow-sf)\\n\\nAdvertising\\n\\n[### 7. Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\\n\\n* Things to do\\n* Mission\\n* price 3 of 4\\n\\n[![Yoga Mayu](https://media.timeout.com/images/103748219/750/422/image.jpg \\\"Yoga Mayu\\\")\\n\\n![Yoga Mayu](https://media.timeout.com/images/103748219/750/562/image.jpg \\\"Yoga Mayu\\\")\\n\\nPhotograph: Courtesy Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\\n\\nFounder Gizella Donald has been practicing yoga in San Francisco since the ‘90s, and the community feel is apparent, from the friendly staff to the post-class mingling around the tea station. She founded this studio in 2008 (and since added a second location in Noe Valley), offering heat-building vinyasa classes tailored to build endurance, flexibility, and strength. Advanced classes work on arm balances and inversions, while yin and mellow flow classes foster concentration and balance. Several of the instructors are former dancers, which means there’s a gentle emphasis placed on proper form and an innate sense of varying capabilities.\\n\\n[Read more](/san-francisco/things-to-do/yoga-mayu)\\n\\nBeen there, done that? Think again, my friend.\\n\\nSign up to our newsletter to enjoy Time Out without spending a thing (as well as options when you're feeling flush).\\n\\nEnter email address![Loading animation](/static/images/loading_icon.gif)\\n\\nDéjà vu! We already have this email. Try another?\\n\\nBy entering your email address you agree to our [Terms of Use](https://www.timeout.com/usa/terms-of-use) and [Privacy Policy](https://www.timeout.com/privacy-notice) and consent to receive emails from Time Out about news, events, offers and partner promotions.\\n\\n🙌  \\nAwesome, you're subscribed!\\n\\nThanks for subscribing! Look out for your first newsletter in your inbox soon!\\n\\nBeen there, done that? Think again, my friend.\\n\\nSign up to our newsletter to enjoy Time Out without spending a thing (as well as options when you're feeling flush).\\n\\nEmail address![Loading animation](/static/images/loading_icon.gif)\\n\\nDéjà vu! We already have this email. Try another?\\n\\nBy entering your email address you agree to our [Terms of Use](https://www.timeout.com/usa/terms-of-use) and [Privacy Policy](https://www.timeout.com/privacy-notice) and consent to receive emails from Time Out about news, events, offers and partner promotions.\\n\\n🙌  \\nAwesome, you're subscribed!\\n\\nThanks for subscribing! Look out for your first newsletter in your inbox soon!\\n\\nRecommended\\n\\n- [[image]\\n\\n  [title]]([cta_link])\\n\\nPopular on Time Out\\n\\n[[image]\\n\\n[category]\\n\\n[title]]([cta_link])\\n\\nYou may also like\\n\\nYou may also like\\n\\nDiscover Time Out original video\\n\\nAdvertising\\n\\nEnter email address![Loading animation](/static/images/loading_icon.gif)\\n\ ar-old Dogpatch studio. Run by husband-wife duo Mimi Moncier and Alan Lewis, the spot’s emphasis is on small class sizes—often 10 students or less—and individualized attention. But though the spot’s 60- or 90-minute classes are intimate, the light-flooded space is luxuriously spacious, decked with globe lanterns, fresh flowers, and colorful drapes. The crowd is arty and creative; Lewis is a working architect and Moncier is an exhibiting artist. Giggling Lotus teachers adapt vinyasa and hatha flow styles, but slower-paced yin classes—as well as pre- and postnatal variations—are also available. Drop-in for a weekly meditation class for just $5.\n\n[Read more](/san-francisco/things-to-do/giggling-lotus)\n\n[### 2. Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\n\n* Things to do\n* Mission\n* price 1 of 4\n\n[![Yoga to the People](https://media.timeout.com/images/103748187/750/422/image.jpg \"Yoga to the People\")\n\n![Yoga to the People](https://media.timeout.com/images/103748187/750/562/image.jpg \"Yoga to the People\")\n\nPhotograph: Courtesy Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\n\nYoga to the People is a bi-coastal institution, with studios in Manhattan, Brooklyn, Berkeley, and San Francisco. It’s easy to miss from the street level—hit the buzzer to be let up or just look for spandex-clad yogis on their way out the door. But the 5th-floor understated entrance belies the stunning space, fronted by a wall of windows overlooking the city. Wood beams overhead and scattered plants lend a warm, welcoming feel. (The studio is also kept quite warm—literally—thought it’s not hot yoga.) The studio’s motto, “no ego, no script, no pedestals,” is aptly reflected in its by-donation model. The body-positive vinyasa classes are vigorous, but unintimidating, focusing on the interplay between movement and breath. Need a distraction from a shaky pose? Teachers often play modern tracks, from reggae to indie rock to electronica.\n\n[Read more](/san-francisco/things-to-do/yoga-to-the-people)\n\nAdvertising\n\n[### 3. Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\n\n* Things to do\n* SoMa\n* price 3 of 4\n\n[![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/422/image.jpg \"Ritual Hot Yoga\")\n\n![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/562/image.jpg \"Ritual Hot Yoga\")\n\nPhotograph: Courtesy Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\n\nWith its charcoal-gray walls, complimentary towels and water, and moody lighting, this candlelit hot yoga studio feels unusually decadent. But the steep prices—$30 for a walk-in class—are the effect of a comparably novel business model. Rather than being paid as independent contractors, yoga teachers here are full-time, salaried employees with health benefits, vacation time, and sick days. The upgrade is apparent in the quality of the instruction—every class is staffed by two teachers, one for demonstrating, and one who cycles through the room to give one-on-one support and feedback. The fast-paced flow is synced to energizing soundtracks chosen by each teacher. In one class, you may hear ‘90s hits; in another, pulse-pumping remixes.\n\n[Read more](/san-francisco/things-to-do/ritual-hot-yoga)\n\n[### 4. Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\n\n* Things to do\n* Mission Dolores\n* price 2 of 4\n\n[![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/422/image.jpg \"Laughing Lotus Yoga Center\")\n\n![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/562/image.jpg \"Laughing Lotus Yoga Center\")\n\nPhotograph: Courtesy Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\n\nThis welcoming Mission yoga studio is refreshingly diverse—it’s not all spindly yogis in sports bras. You’ll know it by its distinctive melon-hued facade, painted with hearts and blooms. Owners Jasmine Tarkeshi and Dana Flynn opened this studio in 2007, retrofitting a former plumbing garage into a color-splashed haven for getting your flow on. You’ll find packed classes full of all different ages and abilities. Lotus Flow classes—the signature—move from breath-centered warm-ups to sun salutations, standing poses, inversions, arm balances, twists, and hip openers. For a faster-paced flow—more chaturangas, less chanting—book the Soul Sweat class, which incorporates cardio and core-building. Don’t miss Lotus Live classes, a party-like atmosphere in which local DJs or musicians provide a live soundtrack.\n\n[Read more](/san-francisco/things-to-do/laughing-lotus-yoga-center)\n\nAdvertising\n\n[### 5. Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\n\n* Things to do\n* Lower Haight\n* price 2 of 4\n\n[![Yoga Garden SF](https://media.timeout.com/images/103748215/750/422/image.jpg \"Yoga Garden SF\")\n\n![Yoga Garden SF](https://media.timeout.com/images/103748215/750/562/image.jpg \"Yoga Garden SF\")\n\nPhotograph: Courtesy Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\n\nHusband-wife yoga instructors Marisa Toriggino and David Nelson moved their Castro yoga studio to this location in 2004. It’s easy to see why: Set in a turn-of-the-century Victorian in the heart of NoPA, the three light-filled, wood-accented studios are one-of-a-kind. In addition to classic vinyasa, yin flow, restorative, and hatha classes, Yoga Garden offers novel classes to avoid a yoga rut, like boxing yoga, aromatherapy flow, and garden barre. (The candlelight flow on Friday evenings is particularly popular.) The changing rooms here are also equipped with showers, a welcome perk.\n\n[Read more](/san-francisco/things-to-do/yoga-garden-sf)\n\n[### 6. Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\n\n* Things to do\n* Cow Hollow\n* price 3 of 4\n\n[![Yoga Flow SF](https://media.timeout.com/images/103748217/750/422/image.jpg \"Yoga Flow SF\")\n\n![Yoga Flow SF](https://media.timeout.com/images/103748217/750/562/image.jpg \"Yoga Flow SF\")\n\nPhotograph: Courtesy Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\n\nIf the Marina is known as the land of Lululemon, this sunny, family-run studio is its church. The pristine, two-room space on the second floor of the Clock Tower building is swathed in floor-to-ceiling glass. The 60-, 75-, and 90-minute vinyasa flow classes are challenging and fast-paced, designed to make you sweat. Around 20 teachers work out of the Union Street studio; another 20 oversee classes at Yoga Flow’s second location in Ingleside Terrace. (Book a class with Union Street favorite Tom Lee—and arrive early to snag a spot.)\n\n[Read more](/san-francisco/things-to-do/yoga-flow-sf)\n\nAdvertising\n\n[### 7. Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\n\n* Things to do\n* Mission\n* price 3 of 4\n\n[![Yoga Mayu](https://media.timeout.com/images/103748219/750/422/image.jpg \"Yoga Mayu\")\n\n![Yoga Mayu](https://media.timeout.com/images/103748219/750/562/image.jpg \"Yoga Mayu\")\n\nPhotograph: Courtesy Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\n\nFounder Gizella Donald has been practicing yoga in San Francisco since the ‘90s, and the community feel is apparent, from the friendly staff to the post-class mingling around the tea station. She founded this studio in 2008 (and since added a second location in Noe Valley), offering heat-building vinyasa classes tailored to build endurance, flexibility, and strength. Advanced classes work on arm balances and inversions, while yin and mellow flow classes foster concentration and balance. Several of the instructors are former dancers, which means there’s a gentle emphasis placed on proper form and an innate sense of varying capabilities.\n\n[Read more](/san-francisco/things-to-do/yoga-mayu)\n\nBeen there, done that? Think again, my friend.\n\nSign up to our newsletter to enjoy Time Out without spending a thing (as well as options when you're feeling flush) se) and [Privacy Policy](https://www.timeout.com/privacy-notice) and consent to receive emails from Time Out about news, events, offers and partner promotions.\\n\\n🙌  \\nAwesome, you're subscribed!\\n\\nThanks for subscribing! Look out for your first newsletter in your inbox soon!\\n\\nS.F.’s top yoga studios\\n-----------------------\\n\\n[### 1. Giggling Lotus](/san-francisco/things-to-do/giggling-lotus)\\n\\n* Things to do\\n* Dogpatch\\n* price 2 of 4\\n\\n[![Giggling Lotus](https://media.timeout.com/images/103748186/750/422/image.jpg \\\"Giggling Lotus\\\")\\n\\n![Giggling Lotus](https://media.timeout.com/images/103748186/750/562/image.jpg \\\"Giggling Lotus\\\")\\n\\nPhotograph: Courtesy Giggling Lotus](/san-francisco/things-to-do/giggling-lotus)\\n\\nWalk-ins are welcome at this five-year-old Dogpatch studio. Run by husband-wife duo Mimi Moncier and Alan Lewis, the spot’s emphasis is on small class sizes—often 10 students or less—and individualized attention. But though the spot’s 60- or 90-minute classes are intimate, the light-flooded space is luxuriously spacious, decked with globe lanterns, fresh flowers, and colorful drapes. The crowd is arty and creative; Lewis is a working architect and Moncier is an exhibiting artist. Giggling Lotus teachers adapt vinyasa and hatha flow styles, but slower-paced yin classes—as well as pre- and postnatal variations—are also available. Drop-in for a weekly meditation class for just $5.\\n\\n[Read more](/san-francisco/things-to-do/giggling-lotus)\\n\\n[### 2. Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\\n\\n* Things to do\\n* Mission\\n* price 1 of 4\\n\\n[![Yoga to the People](https://media.timeout.com/images/103748187/750/422/image.jpg \\\"Yoga to the People\\\")\\n\\n![Yoga to the People](https://media.timeout.com/images/103748187/750/562/image.jpg \\\"Yoga to the People\\\")\\n\\nPhotograph: Courtesy Yoga to the People](/san-francisco/things-to-do/yoga-to-the-people)\\n\\nYoga to the People is a bi-coastal institution, with studios in Manhattan, Brooklyn, Berkeley, and San Francisco. It’s easy to miss from the street level—hit the buzzer to be let up or just look for spandex-clad yogis on their way out the door. But the 5th-floor understated entrance belies the stunning space, fronted by a wall of windows overlooking the city. Wood beams overhead and scattered plants lend a warm, welcoming feel. (The studio is also kept quite warm—literally—thought it’s not hot yoga.) The studio’s motto, “no ego, no script, no pedestals,” is aptly reflected in its by-donation model. The body-positive vinyasa classes are vigorous, but unintimidating, focusing on the interplay between movement and breath. Need a distraction from a shaky pose? Teachers often play modern tracks, from reggae to indie rock to electronica.\\n\\n[Read more](/san-francisco/things-to-do/yoga-to-the-people)\\n\\nAdvertising\\n\\n[### 3. Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\\n\\n* Things to do\\n* SoMa\\n* price 3 of 4\\n\\n[![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/422/image.jpg \\\"Ritual Hot Yoga\\\")\\n\\n![Ritual Hot Yoga](https://media.timeout.com/images/103748190/750/562/image.jpg \\\"Ritual Hot Yoga\\\")\\n\\nPhotograph: Courtesy Ritual Hot Yoga](/san-francisco/things-to-do/ritual-hot-yoga)\\n\\nWith its charcoal-gray walls, complimentary towels and water, and moody lighting, this candlelit hot yoga studio feels unusually decadent. But the steep prices—$30 for a walk-in class—are the effect of a comparably novel business model. Rather than being paid as independent contractors, yoga teachers here are full-time, salaried employees with health benefits, vacation time, and sick days. The upgrade is apparent in the quality of the instruction—every class is staffed by two teachers, one for demonstrating, and one who cycles through the room to give one-on-one support and feedback. The fast-paced flow is synced to energizing soundtracks chosen by each teacher. In one class, you may hear ‘90s hits; in another, pulse-pumping remixes.\\n\\n[Read more](/san-francisco/things-to-do/ritual-hot-yoga)\\n\\n[### 4. Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\\n\\n* Things to do\\n* Mission Dolores\\n* price 2 of 4\\n\\n[![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/422/image.jpg \\\"Laughing Lotus Yoga Center\\\")\\n\\n![Laughing Lotus Yoga Center](https://media.timeout.com/images/103748192/750/562/image.jpg \\\"Laughing Lotus Yoga Center\\\")\\n\\nPhotograph: Courtesy Laughing Lotus Yoga Center](/san-francisco/things-to-do/laughing-lotus-yoga-center)\\n\\nThis welcoming Mission yoga studio is refreshingly diverse—it’s not all spindly yogis in sports bras. You’ll know it by its distinctive melon-hued facade, painted with hearts and blooms. Owners Jasmine Tarkeshi and Dana Flynn opened this studio in 2007, retrofitting a former plumbing garage into a color-splashed haven for getting your flow on. You’ll find packed classes full of all different ages and abilities. Lotus Flow classes—the signature—move from breath-centered warm-ups to sun salutations, standing poses, inversions, arm balances, twists, and hip openers. For a faster-paced flow—more chaturangas, less chanting—book the Soul Sweat class, which incorporates cardio and core-building. Don’t miss Lotus Live classes, a party-like atmosphere in which local DJs or musicians provide a live soundtrack.\\n\\n[Read more](/san-francisco/things-to-do/laughing-lotus-yoga-center)\\n\\nAdvertising\\n\\n[### 5. Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\\n\\n* Things to do\\n* Lower Haight\\n* price 2 of 4\\n\\n[![Yoga Garden SF](https://media.timeout.com/images/103748215/750/422/image.jpg \\\"Yoga Garden SF\\\")\\n\\n![Yoga Garden SF](https://media.timeout.com/images/103748215/750/562/image.jpg \\\"Yoga Garden SF\\\")\\n\\nPhotograph: Courtesy Yoga Garden SF](/san-francisco/things-to-do/yoga-garden-sf)\\n\\nHusband-wife yoga instructors Marisa Toriggino and David Nelson moved their Castro yoga studio to this location in 2004. It’s easy to see why: Set in a turn-of-the-century Victorian in the heart of NoPA, the three light-filled, wood-accented studios are one-of-a-kind. In addition to classic vinyasa, yin flow, restorative, and hatha classes, Yoga Garden offers novel classes to avoid a yoga rut, like boxing yoga, aromatherapy flow, and garden barre. (The candlelight flow on Friday evenings is particularly popular.) The changing rooms here are also equipped with showers, a welcome perk.\\n\\n[Read more](/san-francisco/things-to-do/yoga-garden-sf)\\n\\n[### 6. Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\\n\\n* Things to do\\n* Cow Hollow\\n* price 3 of 4\\n\\n[![Yoga Flow SF](https://media.timeout.com/images/103748217/750/422/image.jpg \\\"Yoga Flow SF\\\")\\n\\n![Yoga Flow SF](https://media.timeout.com/images/103748217/750/562/image.jpg \\\"Yoga Flow SF\\\")\\n\\nPhotograph: Courtesy Yoga Flow SF](/san-francisco/things-to-do/yoga-flow-sf)\\n\\nIf the Marina is known as the land of Lululemon, this sunny, family-run studio is its church. The pristine, two-room space on the second floor of the Clock Tower building is swathed in floor-to-ceiling glass. The 60-, 75-, and 90-minute vinyasa flow classes are challenging and fast-paced, designed to make you sweat. Around 20 teachers work out of the Union Street studio; another 20 oversee classes at Yoga Flow’s second location in Ingleside Terrace. (Book a class with Union Street favorite Tom Lee—and arrive early to snag a spot.)\\n\\n[Read more](/san-francisco/things-to-do/yoga-flow-sf)\\n\\nAdvertising\\n\\n[### 7. Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\\n\\n* Things to do\\n* Mission\\n* price 3 of 4\\n\\n[![Yoga Mayu](https://media.timeout.com/images/103748219/750/422/image.jpg \\\"Yoga Mayu\\\")\\n\\n![Yoga Mayu](https://media.timeout.com/images/103748219/750/562/image.jpg \\\"Yoga Mayu\\\")\\n\\nPhotograph: Courtesy Yoga Mayu](/san-francisco/things-to-do/yoga-mayu)\\n\\nFounder Gizella Donald has been practicing yoga in San Francisco since the ‘90s, and the community feel is apparent, from the friendly staff to the post-class mingling around the tea station. She founded this studio in 2008 (and since added a second location in Noe Valley), offering heat-building vinyasa classes tailored to build endurance, flexibility, and strength. Advanced classes work on arm balances and inversions, while yin and mellow flow classes foster concentration and balance. Several of the instructors are former dancers, which means there’s a gentle emphasis placed on proper form and an innate sense of varying capabilities.\\n\\n[Read more](/san-francisco/things-to-do/yoga-mayu)\\n\\nBeen there, done that? Think again, my friend.\\n\\nSign up to our newsletter to enjoy Time Out without spending a thing (as well as options when you're feeling flush).\\n\\nEnter email address![Loading animation](/static/images/loading_icon.gif)\\n\\nDéjà vu! We already have this email. Try another?\\n\\nBy entering your email address you agree to our [Terms of Use](https://www.timeout.com/usa/terms-of-use) and [Privacy Policy](https://www.timeout.com/privacy-notice) and consent to receive emails from Time Out about news, events, offers and partner promotions.\\n\\n🙌  \\nAwesome, you're subscribed!\\n\\nThanks for subscribing! Look out for your first newsletter in your inbox soon!\\n\\nBeen there, done that? Think again, my friend.\\n\\nSign up to our newsletter to enjoy Time Out without spending a thing (as well as options when you're feeling flush).\\n\\nEmail address![Loading animation](/static/images/loading_icon.gif)\\n\\nDéjà vu! We already have this email. Try another?\\n\\nBy entering your email address you agree to our [Terms of Use](https://www.timeout.com/usa/terms-of-use) and [Privacy Policy](https://www.timeout.com/privacy-notice) and consent to receive emails from Time Out     function filterGraph(t) {
      var tVal = +t;
      var visibleNodes = fullNetworkNodes.filter(function(n) { return n.sequence <= tVal; });
      var ids = visibleNodes.map(function(n) { return n.id; });
      var visibleEdges = fullNetworkEdges.filter(function(e) { return ids.indexOf(e.from) !== -1 && ids.indexOf(e.to) !== -1; });
      network.setData({ nodes: new vis.DataSet(visibleNodes), edges: new vis.DataSet(visibleEdges) });

function updateActiveBox(activeId) {
  var boxes = document.getElementsByClassName('msg-box');
  for (var i = 0; i < boxes.length; i++) {
    var b = boxes[i];
    if (b.dataset.nodeId == activeId) {
      b.classList.add('active');
      b.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
      b.classList.remove('active');
    }
  }
}

network.on('selectNode', function(params) {

    updateActiveBox(params.nodes[0]);
